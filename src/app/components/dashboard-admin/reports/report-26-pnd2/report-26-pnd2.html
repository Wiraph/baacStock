<div class="p-3">
  <div class="max-w-3xl mx-auto rounded-lg p-4 bg-white shadow">
    
    <!-- Form Fields -->
    <div class="space-y-4">
      <!-- เงื่อนไขเวลา -->
      <div class="flex gap-4 items-end">
        <div class="flex-1">
          <label for="selectedYear" class="text-sm font-medium text-gray-700 mb-1 block">ปี</label>
          <select 
            id="selectedYear"
            [(ngModel)]="selectedYear"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option *ngFor="let year of yearOptions" [value]="year.value">{{ year.label }}</option>
          </select>
        </div>
        <div class="flex-1">
          <label for="selectedMonth" class="text-sm font-medium text-gray-700 mb-1 block">เดือน</label>
          <select 
            id="selectedMonth"
            [(ngModel)]="selectedMonth"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option *ngFor="let month of monthOptions" [value]="month.value">{{ month.label }}</option>
          </select>
        </div>
      </div>

      <!-- เงื่อนไขสาขา -->
      <div class="flex gap-4 items-end">
        <div class="flex-1">
          <label for="selectedDivision" class="text-sm font-medium text-gray-700 mb-1 block">สำนักงาน</label>
          <select 
            id="selectedDivision"
            [(ngModel)]="selectedDivision"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option *ngFor="let division of divisionOptions" [value]="division.value">{{ division.label }}</option>
          </select>
        </div>
        <div class="flex-1">
          <label for="selectedProvince" class="text-sm font-medium text-gray-700 mb-1 block">สนจ</label>
          <select 
            id="selectedBranch"
            [(ngModel)]="selectedBranch"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">-- เลือกสาขา --</option>
            <option value="001">สาขา 001</option>
            <option value="002">สาขา 002</option>
          </select>
        </div>
        <div class="flex-1">
          <label for="selectedBranch" class="text-sm font-medium text-gray-700 mb-1 block">สาขา</label>
          <select 
            id="selectedBranch"
            [(ngModel)]="selectedBranch"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">-- เลือกสาขา --</option>
            <option value="001">สาขา 001</option>
            <option value="002">สาขา 002</option>
          </select>
        </div>
      </div>

      <!-- วันที่ยื่นแบบ ภ.ง.ด. 2 -->
      <div class="flex gap-4 items-end">
        <div class="flex-1">
          <label for="filingDate" class="text-sm font-medium text-gray-700 mb-1 block">วันที่ยื่นแบบ ภ.ง.ด. 2</label>
          <div class="relative">
            <input 
              id="filingDate"
              type="text" 
              [value]="formatThaiDate(filingDate)"
              (focus)="showFilingCalendar = true"
              readonly
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-center focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
              <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
              </svg>
            </div>
            <div *ngIf="showFilingCalendar" class="absolute z-50 top-full left-0 mt-1">
              <app-calendar-popup
                [(selected)]="filingDate"
                (dateSelected)="onFilingDateSelected($event)"
                (closed)="showFilingCalendar = false">
              </app-calendar-popup>
            </div>
          </div>
        </div>
      </div>

      <!-- ผู้ลงนาม -->
      <div class="flex gap-4 items-end">
        <div class="flex-1">
          <label for="selectedSignatory" class="text-sm font-medium text-gray-700 mb-1 block">ผู้ลงนาม</label>
          <select 
            id="selectedSignatory"
            [(ngModel)]="selectedSignatory"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option *ngFor="let signatory of signatoryOptions" [value]="signatory.value">{{ signatory.label }}</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-center mt-8 space-x-4">
      <button type="button" (click)="onSearch()"
        class="px-6 py-2 text-sm bg-green-500 text-white rounded hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50">
        ค้นหา
      </button>
    </div>
  </div>
  
  <!-- Document Preview Area -->
  <div class="mt-3 border rounded bg-gray-50 overflow-auto" style="height: 500px;">
    <iframe *ngIf="pdfSrc" [src]="pdfSrc" width="100%" height="100%" style="border:none;"
      title="Preview PDF รายงานหุ้น">
    </iframe>
  </div>

  <!-- Back Button -->
  <div class="flex justify-center mt-6">
    <button 
      type="button" 
      (click)="goBack()" 
      class="px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors duration-200">
      กลับ
    </button>
  </div>
</div>
