<div class="p-3">
    <div class="max-w-3xl mx-auto rounded-lg p-4 bg-white shadow">
  
      <!-- Filters -->
      <div class="space-y-4">
        
        <!-- ยืนยันข้อมูล ณ วันที่ -->
        <div class="border-b border-gray-200 pb-4">
          <div class="grid grid-cols-12 gap-4 items-center">
            <div class="col-span-3">
              <label for="dateType" class="text-sm font-medium text-gray-700">ยืนยันข้อมูล ณ วันที่</label>
            </div>
            <div class="col-span-3">
              <select class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="date-day">วันที่</option>
              </select>
            </div>
            <div class="col-span-6">
              <div class="flex items-center gap-2">
                <select [(ngModel)]="selectedDay" class="w-20 border border-gray-300 rounded-lg px-2 py-2 text-center text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="">วัน</option>
                  <option *ngFor="let d of days" [value]="d">{{ d }}</option>
                </select>
                <select [(ngModel)]="selectedMonth" class="w-24 border border-gray-300 rounded-lg px-2 py-2 text-center text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="">เดือน</option>
                  <option *ngFor="let m of months" [value]="m.value">{{ m.label }}</option>
                </select>
                <select [(ngModel)]="selectedYear" class="w-24 border border-gray-300 rounded-lg px-2 py-2 text-center text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="">ปี</option>
                  <option *ngFor="let y of years" [value]="y">{{ y }}</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- ลูกค้า -->
        <div class="border-b border-gray-200 pb-4">
          <div class="grid grid-cols-12 gap-4 items-center">
            <div class="col-span-3">
              <label for="customerType" class="text-sm font-medium text-gray-700">ลูกค้า</label>
            </div>
             <div class="col-span-3">
               <select 
                 (change)="onCustomerTypeChange($event)"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                 <option value="cus-type">ประเภทลูกค้า</option>
                 <option value="cusFName">ชื่อ</option>
                 <option value="cusLName">นามสกุล</option>
                 <option value="cusID">เลขประชาชน/ผู้เสียภาษี</option>
               </select>
             </div>
            <div class="col-span-6">
              <!-- dropdown สำหรับประเภทลูกค้า -->
              <select *ngIf="selectedCustomerType === 'cus-type'" [(ngModel)]="customerType" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">ทั้งหมด</option>
                <option *ngFor="let type of customerTypes" [value]="type.cusCode">{{ type.cusDesc }}</option>
              </select>
              
              <!-- input field สำหรับชื่อ -->
              <input 
                *ngIf="selectedCustomerType === 'cusFName'"
                type="text" placeholder="ค้นหาชื่อผู้ถือหุ้น" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              
              <!-- input field สำหรับนามสกุล -->
              <input 
                *ngIf="selectedCustomerType === 'cusLName'"
                type="text" placeholder="ค้นหานามสกุลผู้ถือหุ้น" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              
              <!-- input field สำหรับเลขประชาชน/ผู้เสียภาษี -->
              <input 
                *ngIf="selectedCustomerType === 'cusID'"
                type="text" placeholder="ค้นหาเลขประชาชน/ผู้เสียภาษีผู้ถือหุ้น" maxlength="13" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-center space-x-4 pt-4">
          <button 
              type="button" 
              (click)="generateReport('PDF')"
              class="px-3 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700 transition duration-200">
              สร้าง PDF
          </button>
          <button 
              type="button" 
              (click)="generateReport('EXCEL')"
              class="px-3 py-2 text-sm bg-green-600 text-white rounded hover:bg-green-700 transition duration-200">
              สร้าง EXCEL
          </button>
        </div>
      </div>
    </div>
    <!-- Document Preview Area -->
    <div class="mt-3 border rounded bg-gray-50 overflow-hidden flex items-center justify-center" style="height: 500px;">
      <ng-container *ngIf="pdfSrc;">
        <iframe 
            [src]="pdfSrc" 
            title="รายละเอียดผู้ถือหุ้น"
            class="w-full h-full border-0"
            allowfullscreen>
        </iframe>
      </ng-container>
    </div>

  
    <!-- Back Button -->
    <div class="flex justify-center mt-4">
      <button type="button" (click)="goBack()" class="px-5 py-2 text-sm bg-green-500 text-white rounded hover:bg-green-600">กลับ</button>
    </div>
  </div>
  
  <!-- ✅ Loading Overlay แบบโปร่งใส + มองทะลุ + เบลอ -->
  <div *ngIf="isGenerating" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-100 bg-opacity-40 backdrop-blur-sm" style="background-color: rgba(128, 128, 128, 0.7);">
    <div class="text-center">
      <svg class="animate-spin h-10 w-10 text-blue-600 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none"
        viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
      </svg>
      <p class="text-lg text-white font-medium">🔄 กำลังโหลดข้อมูล กรุณารอสักครู่...</p>
    </div>
  </div>
