<div class="p-3">
    <div class="max-w-4xl mx-auto rounded-lg p-4 bg-white shadow">
  
      <!-- Filters -->
      <div class="space-y-4">
        <!-- เงื่อนไขลูกค้า -->
        <div class="border-b border-gray-200 pb-4">
          <div class="flex gap-4 items-end">
            <!-- ค้นหาโดย -->
            <div class="flex-1">
              <label for="searchBy" class="text-sm font-medium text-gray-700 mb-1 block">เงื่อนไขลูกค้า</label>
              <select (change)="onCustomerTypeChange($event)" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="cus-group">กลุ่มประเภทผู้ถือหุ้น</option>
                <option value="cusName">ชื่อ-นามสกุล</option>
                <option value="cusID">เลขบัตรประชาชน/ผู้เสียภาษี</option>
              </select>
            </div>
            
            <!-- กลุ่ม -->
            <div class="flex-1" *ngIf="selectedCustomerType === 'cus-group'">
              <label for="groupSelect" class="text-sm font-medium text-gray-700 mb-1 block">กลุ่ม</label>
              <select 
                (change)="onGroupChange($event)"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">ทั้งหมด</option>
                <option *ngFor="let g of customerGroups" [value]="g.cusCodeg ?? g.cusCODEg">{{ g.cusDescg ?? g.cusDESCg }}</option>
              </select>
            </div>
            
            <!-- ประเภท -->
            <div class="flex-1" *ngIf="selectedCustomerType === 'cus-group'">
              <label for="typeSelect" class="text-sm font-medium text-gray-700 mb-1 block">ประเภท</label>
              <select [(ngModel)]="selectedType" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option *ngIf="allTypeOption" value="">ทั้งหมด</option>
                <option *ngFor="let t of filteredCustomerTypes" [value]="t.cusCode">{{ t.cusDesc }}</option>
              </select>
            </div>
          </div>
        </div>

        <!-- input fields สำหรับชื่อ-นามสกุล -->
        <div *ngIf="selectedCustomerType === 'cusName'" class="border-b border-gray-200 pb-4">
          <div class="flex gap-2">
            <div class="flex-1">
              <label for="firstName" class="text-sm font-medium text-gray-700 mb-1 block">ชื่อ</label>
              <input [(ngModel)]="firstName" type="text" id="firstName" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex-1">
              <label for="lastName" class="text-sm font-medium text-gray-700 mb-1 block">นามสกุล</label>
              <input [(ngModel)]="lastName" type="text" id="lastName" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
        </div>
          
        <!-- input field สำหรับเลขประชาชน/ผู้เสียภาษี -->
        <div *ngIf="selectedCustomerType === 'cusID'" class="pb-4">
          <div class="flex gap-4 items-end">
            <div class="flex-1">
              <label for="customerID" class="text-sm font-medium text-gray-700 mb-1 block">เลขบัตรประชาชน/ผู้เสียภาษี</label>
              <input [(ngModel)]="customerId" type="text" placeholder="ค้นหาเลขบัตรประชาชน/ผู้เสียภาษี" maxlength="13" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
        </div>

    <!-- วันที่ยืนยัน -->
    <div class="border-b border-gray-200 pb-4">
      <div class="flex gap-4 items-end">
        <div class="flex-1">
          <label for="confirmDate" class="text-sm font-medium text-gray-700 mb-1 block">วันที่ยืนยัน</label>
          <div class="flex items-center gap-2">
            <select class="w-20 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" [(ngModel)]="selectedConfirmDay">
              <option value="">วัน</option>
              <option *ngFor="let d of days" [value]="d">{{ d }}</option>
            </select>
            <select class="w-24 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" [(ngModel)]="selectedConfirmMonth">
              <option value="">เดือน</option>
              <option *ngFor="let m of months" [value]="m.value">{{ m.label }}</option>
            </select>
            <select class="w-24 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" [(ngModel)]="selectedConfirmYear">
              <option value="">ปี</option>
              <option *ngFor="let y of years" [value]="y">{{ y }}</option>
            </select>
          </div>
        </div>
        
        <div class="flex-1">
          <label for="toDate" class="text-sm font-medium text-gray-700 mb-1 block">ถึงวันที่</label>
          <div class="flex items-center gap-2">
            <select class="w-20 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" [(ngModel)]="selectedToDay">
              <option value="">วัน</option>
              <option *ngFor="let d of days" [value]="d">{{ d }}</option>
            </select>
            <select class="w-24 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" [(ngModel)]="selectedToMonth">
              <option value="">เดือน</option>
              <option *ngFor="let m of months" [value]="m.value">{{ m.label }}</option>
            </select>
            <select class="w-24 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" [(ngModel)]="selectedToYear">
              <option value="">ปี</option>
              <option *ngFor="let y of years" [value]="y">{{ y }}</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- ผู้ลงนาม -->
    <div class="border-b border-gray-200 pb-4">
      <div class="flex gap-4 items-end">
        <div class="flex-1">
          <label for="signatory" class="text-sm font-medium text-gray-700 mb-1 block">ผู้ลงนาม</label>
          <select 
            id="signatory"
            [(ngModel)]="signatory"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">-- เลือกผู้ลงนาม --</option>
            <option *ngFor="let option of signatoryOptions" [value]="option.value">{{ option.label }}</option>
          </select>
        </div>
      </div>
    </div>

        <!-- Actions -->
        <div class="flex items-center justify-center space-x-4 pt-4">
          <button type="button" (click)="submit()" class="px-3 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50"> 
            ค้นหา
          </button>
        </div>
      </div>
    </div>

    <!-- Results Table -->
    <div *ngIf="results.length > 0" class="mt-4 bg-white rounded-lg shadow overflow-hidden">
      <div class="overflow-auto max-w-full" style="height: 70vh;">
        <table class="w-full divide-y divide-gray-300 table-fixed">
          <thead class="bg-green-600 sticky top-0 z-10">
            <tr>
              <th class="px-4 py-3 text-left text-xs text-white font-semibold uppercase tracking-wider">ชื่อ-สกุล/นิติบุคคล</th>
              <th class="px-4 py-3 text-center text-xs text-white font-semibold uppercase tracking-wider">เอกสาร</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
            <tr *ngFor="let r of results" class="hover:bg-gray-50">
              <td class="px-4 py-2 whitespace-nowrap text-xs truncate">{{ formatDisplayName(r) }}</td>
              <td class="px-4 py-2 whitespace-nowrap text-xs text-center">
                <button (click)="generateFor(r)" type="button" class="px-3 py-1 text-xs bg-blue-700 text-white rounded hover:bg-blue-800">Word</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Back Button -->
    <div class="flex justify-center mt-4 mb-8">
      <button type="button" (click)="goBack()"
        class="px-5 py-2 text-sm bg-green-500 text-white rounded hover:bg-green-600">กลับ</button>
    </div>
</div>

<!-- ✅ Loading Overlay แบบโปร่งใส + มองทะลุ + เบลอ -->
<div *ngIf="loading" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-100 bg-opacity-40 backdrop-blur-sm" style="background-color: rgba(128, 128, 128, 0.7);">
  <div class="text-center">
    <svg class="animate-spin h-10 w-10 text-blue-600 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none"
      viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
    </svg>
    <p class="text-lg text-white font-medium">🔄 กำลังโหลดข้อมูล กรุณารอสักครู่...</p>
  </div>
</div>
