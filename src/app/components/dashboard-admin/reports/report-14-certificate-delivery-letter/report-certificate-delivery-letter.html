<div class="p-3">
    <div class="max-w-4xl mx-auto rounded-lg p-4 bg-white shadow">
  
      <!-- Filters -->
      <div class="space-y-4">
        <!-- เงื่อนไขลูกค้า -->
        <div class="border-b border-gray-200 pb-4">
          <div class="flex gap-4 items-end">
            <!-- ค้นหาโดย -->
            <div class="flex-1">
              <label for="searchBy" class="text-sm font-medium text-gray-700 mb-1 block">เงื่อนไขลูกค้า</label>
              <select (change)="onCustomerTypeChange($event)" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="cus-group">กลุ่มประเภทผู้ถือหุ้น</option>
                <option value="cusName">ชื่อ-นามสกุล</option>
                <option value="cusID">เลขบัตรประชาชน/ผู้เสียภาษี</option>
              </select>
            </div>
            
            <!-- กลุ่ม -->
            <div class="flex-1" *ngIf="selectedCustomerType === 'cus-group'">
              <label for="groupSelect" class="text-sm font-medium text-gray-700 mb-1 block">กลุ่ม</label>
              <select 
                (change)="onGroupChange($event)"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">ทั้งหมด</option>
                <option value="treasury">กระทรวงการคลัง</option>
                <option value="farmer">เกษตรกร</option>
                <option value="farmer-institute">สถาบันเกษตรกร</option>
                <option value="bank">สถาบันการเงิน</option>
                <option value="individual">บุคคลธรรมดา</option>
                <option value="staff">พนักงาน ธ.ก.ส.</option>
                <option value="individual-all">บุคคลธรรมดา (รวมนิติบุคคล ข้าราชการ พนักงานองค์กรรัฐ และวิสาหกิจ)</option>
              </select>
            </div>
            
            <!-- ประเภท -->
            <div class="flex-1" *ngIf="selectedCustomerType === 'cus-group'">
              <label for="typeSelect" class="text-sm font-medium text-gray-700 mb-1 block">ประเภท</label>
              <select class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <!-- ทั้งหมด -->
                <ng-container *ngIf="selectedGroup === ''">
                  <option value="">ทั้งหมด</option>
                  <option value="government">รัฐบาล (กระทรวงการคลัง)</option>
                  <option value="bank">ธนาคารและสถาบันการเงินอื่นในประเทศ</option>
                  <option value="individual">บุคคลธรรมดา</option>
                  <option value="individual-no-interest">บุคคลธรรมดาซึ่งไม่ประสงค์รับดอกเบี้ย</option>
                  <option value="baac-staff">พนักงาน ธ.ก.ส.</option>
                  <option value="farmer">เกษตรกร</option>
                  <option value="non-profit">สถาบันไม่หากำไรแต่ไม่รับการยกเว้นการเสียภาษี(ณกส. ณฌกฝ.)</option>
                  <option value="informal-group">กลุ่มไม่เป็นทางการ</option>
                  <option value="discontinued-coop">ยกเลิก สหกรณ์นอกภาคการเกษตร (สหกรณ์นิคม)</option>
                  <option value="retail-coop">สหกรณ์ร้านค้า</option>
                  <option value="service-coop">สหกรณ์บริการ</option>
                  <option value="credit-union">สหกรณ์เครดิตยูเนียน</option>
                  <option value="agri-coop">สหกรณ์การเกษตร สหกรณ์ประมง สหกรณ์นิคม</option>
                  <option value="skt">สกต.</option>
                  <option value="farmer-group">กลุ่มเกษตรกร</option>
                  <option value="savings-coop">สหกรณ์ออมทรัพย์, ชุมนุมสหกรณ์</option>
                  <option value="community-finance">สถาบันการเงินชุมชน</option>
                </ng-container>

                <!-- Treasury -->
                <ng-container *ngIf="selectedGroup === 'treasury'">
                  <option value="government">รัฐบาล (กระทรวงการคลัง)</option>
                </ng-container>

                <!-- Farmer -->
                <ng-container *ngIf="selectedGroup === 'farmer'">
                  <option value="farmer">เกษตรกร</option>
                </ng-container>

                <!-- Farmer Institute -->
                <ng-container *ngIf="selectedGroup === 'farmer-institute'">
                  <option value="">ทั้งหมด</option>
                  <option value="discontinued-coop">ยกเลิก สหกรณ์นอกภาคการเกษตร (สหกรณ์นิคม)</option>
                  <option value="retail-coop">สหกรณ์ร้านค้า</option>
                  <option value="service-coop">สหกรณ์บริการ</option>
                  <option value="credit-union">สหกรณ์เครดิตยูเนียน</option>
                  <option value="agri-coop">สหกรณ์การเกษตร สหกรณ์ประมง สหกรณ์นิคม</option>
                  <option value="skt">สกต.</option>
                  <option value="farmer-group">กลุ่มเกษตรกร</option>
                  <option value="savings-coop">สหกรณ์ออมทรัพย์, ชุมนุมสหกรณ์</option>
                </ng-container>

                <!-- Bank -->
                <ng-container *ngIf="selectedGroup === 'bank'">
                  <option value="bank">ธนาคารและสถาบันการเงินอื่นในประเทศ</option>
                </ng-container>

                <!-- Individual -->
                <ng-container *ngIf="selectedGroup === 'individual'">
                  <option value="individual">บุคคลธรรมดา</option>
                  <option value="individual-no-interest">บุคคลธรรมดาซึ่งไม่ประสงค์รับดอกเบี้ย</option>
                </ng-container>

                <!-- Staff -->
                <ng-container *ngIf="selectedGroup === 'staff'">
                  <option value="baac-staff">พนักงาน ธ.ก.ส.</option>
                </ng-container>

                <!-- Individual All -->
                <ng-container *ngIf="selectedGroup === 'individual-all'">
                  <option value="">ทั้งหมด</option>
                  <option value="individual">บุคคลธรรมดา</option>
                  <option value="individual-no-interest">บุคคลธรรมดาซึ่งไม่ประสงค์รับดอกเบี้ย</option>
                  <option value="non-profit">สถาบันไม่หากำไรแต่ไม่รับการยกเว้นการเสียภาษี(ณกส. ณฌกฝ.)</option>
                  <option value="informal-group">กลุ่มไม่เป็นทางการ</option>
                  <option value="community-finance">สถาบันการเงินชุมชน</option>
                </ng-container>
              </select>
            </div>
          </div>
        </div>

        <!-- input fields สำหรับชื่อ-นามสกุล -->
        <div *ngIf="selectedCustomerType === 'cusName'" class="border-b border-gray-200 pb-4">
          <div class="flex gap-2">
            <div class="flex-1">
              <label for="firstName" class="text-sm font-medium text-gray-700 mb-1 block">ชื่อ</label>
              <input type="text" id="firstName" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="flex-1">
              <label for="lastName" class="text-sm font-medium text-gray-700 mb-1 block">นามสกุล</label>
              <input type="text" id="lastName" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
        </div>
          
        <!-- input field สำหรับเลขประชาชน/ผู้เสียภาษี -->
        <div *ngIf="selectedCustomerType === 'cusID'" class="pb-4">
          <div class="flex gap-4 items-end">
            <div class="flex-1">
              <label for="customerID" class="text-sm font-medium text-gray-700 mb-1 block">เลขบัตรประชาชน/ผู้เสียภาษี</label>
              <input type="text" placeholder="ค้นหาเลขบัตรประชาชน/ผู้เสียภาษี" maxlength="13" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
        </div>

    <!-- วันที่ยืนยัน -->
    <div class="border-b border-gray-200 pb-4">
      <div class="flex gap-4 items-end">
        <div class="flex-1">
          <label for="confirmDate" class="text-sm font-medium text-gray-700 mb-1 block">วันที่ยืนยัน</label>
          <div class="flex items-center gap-2">
            <select class="w-20 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" [(ngModel)]="selectedConfirmDay">
              <option value="">วัน</option>
              <option *ngFor="let d of days" [value]="d">{{ d }}</option>
            </select>
            <select class="w-24 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" [(ngModel)]="selectedConfirmMonth">
              <option value="">เดือน</option>
              <option *ngFor="let m of months" [value]="m.value">{{ m.label }}</option>
            </select>
            <select class="w-24 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" [(ngModel)]="selectedConfirmYear">
              <option value="">ปี</option>
              <option *ngFor="let y of years" [value]="y">{{ y }}</option>
            </select>
          </div>
        </div>
        
        <div class="flex-1">
          <label for="toDate" class="text-sm font-medium text-gray-700 mb-1 block">ถึงวันที่</label>
          <div class="flex items-center gap-2">
            <select class="w-20 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" [(ngModel)]="selectedToDay">
              <option value="">วัน</option>
              <option *ngFor="let d of days" [value]="d">{{ d }}</option>
            </select>
            <select class="w-24 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" [(ngModel)]="selectedToMonth">
              <option value="">เดือน</option>
              <option *ngFor="let m of months" [value]="m.value">{{ m.label }}</option>
            </select>
            <select class="w-24 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" [(ngModel)]="selectedToYear">
              <option value="">ปี</option>
              <option *ngFor="let y of years" [value]="y">{{ y }}</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- ผู้ลงนาม -->
    <div class="border-b border-gray-200 pb-4">
      <div class="flex gap-4 items-end">
        <div class="flex-1">
          <label for="signatory" class="text-sm font-medium text-gray-700 mb-1 block">ผู้ลงนาม</label>
          <select 
            id="signatory"
            [(ngModel)]="signatory"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">-- เลือกผู้ลงนาม --</option>
            <option *ngFor="let option of signatoryOptions" [value]="option.value">{{ option.label }}</option>
          </select>
        </div>
      </div>
    </div>

        <!-- Actions -->
        <div class="flex items-center justify-center space-x-3">
          <button (click)="genPdf('PDF')" type="button" class="px-3 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">แสดงรายงาน PDF</button>
          <button (click)="genPdf('XLS')" type="button" class="px-3 py-2 text-sm bg-green-600 text-white rounded hover:bg-green-700">แสดงรายงาน EXCEL</button>
        </div>
      </div>
    </div>

    <!-- Document Preview Area -->
    <div class="mt-3 border rounded bg-gray-50 overflow-auto" style="height: 500px;">
      <iframe *ngIf="pdfSrc" [src]="pdfSrc" width="100%" height="100%" style="border:none;"
        title="Preview PDF รายงานหุ้น">
      </iframe>
    </div>

    <!-- Back Button -->
    <div class="flex justify-center mt-4 mb-8">
      <button type="button" (click)="goBack()"
        class="px-5 py-2 text-sm bg-green-500 text-white rounded hover:bg-green-600">กลับ</button>
    </div>
</div>
