<div class="min-h-screen bg-gray-50 p-4 font-sans" *ngIf="main">
  <!-- Header Section -->
  <div class="max-w-6xl mx-auto">
    <!-- Page Header -->
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-gray-800 mb-2">📊 รายงานระบบ</h1>
      <p class="text-gray-600">เลือกดูรายงานที่ต้องการ</p>
    </div>

    <!-- Reports Container -->
    <div class="grid gap-6">
      
      <!-- Normal Reports Section -->
      <div class="bg-white rounded-xl shadow-md overflow-hidden">
        <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
          <div class="flex items-center">
            <span class="text-xl mr-3">📋</span>
            <h2 class="text-lg font-semibold text-gray-800">รายงานปกติ</h2>
            <span class="ml-auto bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-medium">
              {{ normalReports.length }} รายการ
            </span>
          </div>
        </div>
        
        <div class="p-6">
          <div class="grid gap-3">
            <div *ngFor="let report of normalReports; let i = index" 
                 class="group relative">
              <button class="w-full flex items-center p-4 rounded-lg border border-gray-200 hover:border-gray-300 hover:bg-gray-50 cursor-pointer transition-all duration-200 ease-out hover:shadow-sm text-left"
                   (click)="onReportClick(report)">
                <div class="flex-shrink-0 w-10 h-10 bg-gray-100 rounded-lg flex items-center justify-center mr-4 group-hover:bg-gray-200 transition-colors duration-200">
                  <span class="text-gray-600 text-lg">{{ report.icon }}</span>
                </div>
                <div class="flex-1 min-w-0">
                  <h3 class="text-gray-800 font-medium text-sm leading-tight group-hover:text-gray-900 transition-colors duration-200">
                    {{ report.title }}
                  </h3>
                  <p class="text-gray-500 text-xs mt-1">คลิกเพื่อดูรายงาน</p>
                </div>
                <div class="flex-shrink-0 ml-4">
                  <svg class="w-4 h-4 text-gray-400 group-hover:text-gray-600 group-hover:translate-x-1 transition-all duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                  </svg>
                </div>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div> 

<div class="m-4 rounded-xl shadow-md bg-white" *ngIf="report">
  <div class="text-center text-xl py-2 bg-lime-400 text-white rounded-t-xl">
    <p>{{headerReport}}</p>
  </div>
  <div *ngIf="actView == 'report_transfer'"><app-reporttransfer (headerChange)="getHeader($event)"></app-reporttransfer></div>
</div>
