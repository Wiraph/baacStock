<div class="bg-white shadow-md">
  <div class="w-full bg-green-500 h-auto text-white text-center text-xl font-bold py-2 rounded-t-lg">
    ใบคำขอซื้อหุ้น
  </div>
  <div class="max-w-2xl mx-auto p-6 bg-white shadow-md rounded-lg space-y-6">
    <p class="text-red-600 font-medium">กรุณากรอกข้อมูลให้ครบถ้วน</p>

    <!-- นิติบุคคล -->
    <div class="flex items-center gap-2">
      <input type="checkbox" id="agree" [(ngModel)]="agreed" class="h-5 w-5 text-blue-600 rounded">
      <label for="agree" class="text-gray-700">เป็นนิติบุคคล (หากเป็นบุคคลทั่วไป ไม่ต้องคลิก)</label>
    </div>

    <!-- ข้อมูลผู้ซื้อ -->
    <div class="space-y-4">
      <div>
        <label for="idCard" class="block text-gray-700 font-medium mb-1">เลขที่บัตรแสดงตน</label>
        <input type="text" id="idCard" [(ngModel)]="idCard"
          class="border border-gray-300 rounded-md p-2 w-full focus:ring-2 focus:ring-blue-300 focus:outline-none"
          placeholder="กรอกเลขที่บัตรแสดงตน">
      </div>

      <div>
        <label for="job" class="block text-gray-700 font-medium mb-1">อาชีพ</label>
        <input type="text" id="job" [(ngModel)]="job"
          class="border border-gray-300 rounded-md p-2 w-full focus:ring-2 focus:ring-blue-300 focus:outline-none"
          placeholder="กรอกอาชีพ">
      </div>

      <div>
        <label for="" class="block text-gray-700 font-medium mb-1">จำนวนหุ้น</label>
        <input type="text" [(ngModel)]="shareAmount"
          class="border border-gray-300 rounded-md p-2 w-full focus:ring-2 focus:ring-blue-300 focus:outline-none"
          placeholder="กรอกจำนวนหุ้นที่ต้องการซื้อ">
        <p class="text-gray-500 text-sm mt-1">กรณีที่เป็นนิติบุคคล ขั้นต่ำ 100 หุ้น และหากเป็นบุคคลทั่วไป ขั้นต่ำ 50
          หุ้น</p>
      </div>
    </div>

    <!-- วิธีการชำระเงิน -->
    <div class="space-y-4">
      <p class="text-gray-700 font-medium">วิธีการชำระเงิน</p>
      <div class="flex gap-4">
        <label class="flex items-center gap-2">
          <input type="radio" name="paymentMethod" [(ngModel)]="paymentMethod" value="1" checked
            class="h-4 w-4 text-blue-600">
          เงินสด
        </label>
        <label class="flex items-center gap-2">
          <input type="radio" name="paymentMethod" [(ngModel)]="paymentMethod" value="2" class="h-4 w-4 text-blue-600">
          โอนบัญชีเงินฝาก ธ.ก.ส.
        </label>
        <label class="flex items-center gap-2">
          <input type="radio" name="paymentMethod" [(ngModel)]="paymentMethod" value="3" class="h-4 w-4 text-blue-600">
          เช็ค
        </label>
      </div>

      <!-- โอนบัญชี -->
      <div *ngIf="paymentMethod === '2'" class="space-y-2 mt-2">
        <div>
          <label for="accountNumber" class="block mb-1 font-medium text-gray-700">เลขที่บัญชี</label>
          <input id="accountNumber" type="text" [(ngModel)]="accountNumber" placeholder="กรอกเลขที่บัญชี"
            class="border border-gray-300 rounded-md p-2 w-full focus:ring-2 focus:ring-blue-300 focus:outline-none">
        </div>
        <div>
          <label for="accountName" class="block mb-1 font-medium text-gray-700">ชื่อบัญชี</label>
          <input id="accountName" type="text" [(ngModel)]="accountName" placeholder="กรอกชื่อบัญชี"
            class="border border-gray-300 rounded-md p-2 w-full focus:ring-2 focus:ring-blue-300 focus:outline-none">
        </div>
      </div>

      <!-- เช็ค -->
      <div *ngIf="paymentMethod === '3'" class="space-y-2 mt-2">
        <div>
          <label for="checkNumber" class="block mb-1 font-medium text-gray-700">หมายเลขเช็ค</label>
          <input id="checkNumber" type="text" [(ngModel)]="checkNumber" placeholder="กรอกหมายเลขเช็ค"
            class="border border-gray-300 rounded-md p-2 w-full focus:ring-2 focus:ring-blue-300 focus:outline-none">
        </div>
        <div>
          <label for="checkDate" class="block mb-1 font-medium text-gray-700">วันที่บนเช็ค</label>
          <div class="relative w-56">
            <input id="checkDate" type="text" [value]="formatThaiDate(selectedDateFrom)"
              (focus)="showCalendarFrom = true" readonly
              class="w-full border rounded px-3 py-2 text-sm bg-white cursor-pointer focus:ring-2 focus:ring-blue-300">
            <div *ngIf="showCalendarFrom" class="absolute z-50 top-full left-0 mt-1">
              <app-calendar-popup [(selected)]="selectedDateFrom" (dateSelected)="onDateFromSelected($event)"
                (closed)="showCalendarFrom = false">
              </app-calendar-popup>
            </div>
          </div>
        </div>
        <div>
          <label for="bankName" class="block mb-1 font-medium text-gray-700">ชื่อธนาคาร</label>
          <input id="bankName" type="text" [(ngModel)]="bankName" placeholder="กรอกชื่อธนาคาร"
            class="border border-gray-300 rounded-md p-2 w-full focus:ring-2 focus:ring-blue-300 focus:outline-none">
        </div>
        <div>
          <label for="branchName" class="block mb-1 font-medium text-gray-700">ชื่อสาขา</label>
          <input id="branchName" type="text" [(ngModel)]="branchName" placeholder="กรอกชื่อสาขา"
            class="border border-gray-300 rounded-md p-2 w-full focus:ring-2 focus:ring-blue-300 focus:outline-none">
        </div>
      </div>
    </div>

    <!-- วิธีรับเงินปันผล -->
    <div class="space-y-4">
      <p class="text-gray-700 font-medium">วิธีรับเงินปันผล</p>
      <div class="flex gap-4">
        <label class="flex items-center gap-2">
          <input type="radio" name="dividendMethod" [(ngModel)]="dividendMethod" value="1" checked
            class="h-4 w-4 text-blue-600">
          บริจาคให้ ธ.ก.ส.
        </label>
        <label class="flex items-center gap-2">
          <input type="radio" name="dividendMethod" [(ngModel)]="dividendMethod" value="2"
            class="h-4 w-4 text-blue-600">
          โอนบัญชีเงินฝาก ธ.ก.ส.
        </label>
      </div>
      <div *ngIf="dividendMethod === '2'" class="space-y-2 mt-2">
        <div>
          <label for="accountNumber2" class="block mb-1 font-medium text-gray-700">เลขที่บัญชี</label>
          <input id="accountNumber2" type="text" [(ngModel)]="accountNumber2" placeholder="กรอกเลขที่บัญชี"
            class="border border-gray-300 rounded-md p-2 w-full focus:ring-2 focus:ring-blue-300 focus:outline-none">
        </div>
        <div>
          <label for="accountName2" class="block mb-1 font-medium text-gray-700">ชื่อบัญชี</label>
          <input id="accountName2" type="text" [(ngModel)]="accountName2" placeholder="กรอกชื่อบัญชี"
            class="border border-gray-300 rounded-md p-2 w-full focus:ring-2 focus:ring-blue-300 focus:outline-none">
        </div>
        <div>
          <label for="branchName2" class="block mb-1 font-medium text-gray-700">ชื่อสาขา</label>
          <input id="branchName2" type="text" [(ngModel)]="branchName2" placeholder="กรอกชื่อสาขา"
            class="border border-gray-300 rounded-md p-2 w-full focus:ring-2 focus:ring-blue-300 focus:outline-none">
        </div>
      </div>
    </div>
  </div>

  <!-- 🔁 ปุ่มโหลดใหม่ -->
  <div class="p-4 text-center text-gray-700">
    <button (click)="printPdf()"
      class="py-2 px-3 bg-amber-500 rounded-xl text-white cursor-pointer hover:bg-amber-400 transition-all">
      ปริ้นใบคำขอซื้อหุ้นสามัญ
    </button>
  </div>
</div>
