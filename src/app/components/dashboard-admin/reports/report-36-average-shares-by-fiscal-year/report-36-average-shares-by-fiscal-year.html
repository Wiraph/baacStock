<div class="p-3">
  <div class="max-w-2xl mx-auto rounded-lg p-6 bg-white shadow">
    
    <!-- Year Display Section -->
    <div class="mb-6">
      <div class="flex items-center justify-center">
        <div class="bg-gray-50 border border-gray-200 rounded-lg p-4 min-w-[300px] text-center">
          <label for="selectedYear" class="block text-sm font-bold text-gray-700 mb-2">ปีบัญชี:</label>
          <input 
            type="text"
            id="selectedYear"
            [(ngModel)]="selectedYear"
            class="bg-yellow-50 border border-green-300 rounded-lg px-4 py-2 text-lg font-bold text-black focus:outline-none focus:ring-2 focus:ring-green-500 w-full text-center">
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-center space-x-3">
      <button type="button" (click)="recordChanges()" 
        class="px-3 py-2 text-sm bg-green-600 text-white rounded border border-white hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50">
        บันทึกการเปลี่ยนแปลงหุ้นบุริมสิทธิ
      </button>
      <button type="button" (click)="showReport()" 
        class="px-3 py-2 text-sm bg-green-600 text-white rounded border border-white hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50">
        แสดงรายงาน
      </button>
      <button type="button" (click)="goBack()" 
        class="px-3 py-2 text-sm bg-green-600 text-white rounded border border-white hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50">
        กลับสู่เมนูรายงาน
      </button>
    </div>
  </div>
</div>
