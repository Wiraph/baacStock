<div class="p-3">
    <div class="max-w-3xl mx-auto rounded-lg p-4 bg-white shadow">
  
      <!-- Filters -->
      <div class="space-y-4">
        
        <!-- ยืนยันข้อมูล ณ วันที่ -->
        <div class="border-b border-gray-200 pb-4">
          <div class="grid grid-cols-12 gap-4 items-center">
            <div class="col-span-3">
              <label for="dateType" class="text-sm font-medium text-gray-700">ยืนยันข้อมูล ณ วันที่</label>
            </div>
            <div class="col-span-3">
              <select class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="date-day">วันที่</option>
              </select>
            </div>
            <div class="col-span-6">
              <div class="flex items-center gap-2">
                <select class="w-20 border border-gray-300 rounded-lg px-2 py-2 text-center text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="">วัน</option>
                  <option *ngFor="let d of days" [value]="d">{{ d }}</option>
                </select>
                <select class="w-24 border border-gray-300 rounded-lg px-2 py-2 text-center text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="">เดือน</option>
                  <option *ngFor="let m of months" [value]="m.value">{{ m.label }}</option>
                </select>
                <select class="w-24 border border-gray-300 rounded-lg px-2 py-2 text-center text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="">ปี</option>
                  <option *ngFor="let y of years" [value]="y">{{ y }}</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- ลูกค้า -->
        <div class="border-b border-gray-200 pb-4">
          <div class="grid grid-cols-12 gap-4 items-center">
            <div class="col-span-3">
              <label for="customerType" class="text-sm font-medium text-gray-700">ลูกค้า</label>
            </div>
             <div class="col-span-3">
               <select 
                 (change)="onCustomerTypeChange($event)"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                 <option value="cus-type">ประเภทลูกค้า</option>
                 <option value="cusFName">ชื่อ</option>
                 <option value="cusLName">นามสกุล</option>
                 <option value="cusID">เลขประชาชน/ผู้เสียภาษี</option>
               </select>
             </div>
            <div class="col-span-6">
              <!-- แสดง dropdown สำหรับประเภทลูกค้า -->
              <select *ngIf="selectedCustomerType === 'cus-type'" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">ทั้งหมด</option>
                <option value="">รัฐบาล (กระทรวงการคลัง)</option>
                <option value="">ธนาคารและสถาบันการเงินอื่นในประเทศ</option>
                <option value="">บุคคลธรรมดา</option>
                <option value="">บุคคลธรรมดาซึ่งไม่ประสงค์รับดอกเบี้ย</option>
                <option value="">พนักงาน ธ.ก.ส.</option>
                <option value="">เกษตรกร</option>
                <option value="">สถาบันไม่หากำไรแต่ไม่รับการยกเว้นการเสียภาษี(ณกส. ณฌกฝ.)</option>
                <option value="">กลุ่มไม่เป็นทางการ</option>
                <option value="">ยกเลิก สหกรณ์นอกภาคการเกษตร (สหกรณ์นิคม)</option>
                <option value="">สหกรณร้านค้า</option>
                <option value="">สหกรณ์บริการ</option>
                <option value="">สหกรณ์เครดิตยูเนียน</option>
                <option value="">สหกรณ์การเกษตร สหกรณ์ประมง สหกรณ์นิคม</option>
                <option value="">สกต.</option>
                <option value="">กลุ่มเกษตรกร</option>
                <option value="">สหกรณ์ออมทรัพย์, ชุมนุมสหกรณ์</option>
                <option value="">สถาบันการเงินชุมชน</option>
              </select>
              
              <!-- แสดง input field สำหรับชื่อ -->
              <input 
                *ngIf="selectedCustomerType === 'cusFName'"
                type="text" 
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              
              <!-- แสดง input field สำหรับนามสกุล -->
              <input 
                *ngIf="selectedCustomerType === 'cusLName'"
                type="text" 
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              
              <!-- แสดง input field สำหรับเลขประชาชน/ผู้เสียภาษี -->
              <input 
                *ngIf="selectedCustomerType === 'cusID'"
                type="text" 
                maxlength="13"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-center space-x-4 pt-4">
          <button type="button" class="px-3 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">ค้นหา</button>
        </div>

      </div>
    </div>
    <!-- Document Preview Area -->
    <div class="mt-3 border rounded bg-gray-50 overflow-auto" style="height: 500px;"></div>
  
    <!-- Back Button -->
    <div class="flex justify-center mt-4">
      <button type="button" (click)="goBack()" class="px-5 py-2 text-sm bg-green-500 text-white rounded hover:bg-green-600">กลับ</button>
    </div>
  </div>
