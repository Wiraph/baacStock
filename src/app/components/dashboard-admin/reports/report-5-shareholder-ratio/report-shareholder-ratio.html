<div class="p-3">
    <div class="max-w-3xl mx-auto rounded-lg p-4 bg-white shadow">
  
      <!-- Filters -->
      <div class="space-y-3">

        <!-- Row: วันที่ (วัน/เดือน/ปี) -->
        <div class="border-b border-gray-200 pb-3 mb-3">
          <div class="flex items-center justify-center gap-4">
            <label for="date" class="text-sm text-gray-700">วันที่ : </label>
            <div class="flex items-center gap-2">
              <select 
                id="day"
                [(ngModel)]="selectedDay"
                class="w-20 border rounded px-2 py-1.5 text-center text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">วัน</option>
                <option *ngFor="let d of days" [value]="d">{{ d }}</option>
              </select>
              <select 
                id="month"
                [(ngModel)]="selectedMonth"
                class="w-24 border rounded px-2 py-1.5 text-center text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">เดือน</option>
                <option *ngFor="let m of months" [value]="m.value">{{ m.label }}</option>
              </select>
              <select 
                id="year"
                [(ngModel)]="selectedYear"
                class="w-24 border rounded px-2 py-1.5 text-center text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">ปี</option>
                <option *ngFor="let y of years" [value]="y">{{ y }}</option>
              </select>
            </div>
          </div>
        </div>
  
        <!-- Actions -->
        <div class="flex items-center justify-center space-x-3">
          <button 
            type="button" 
            (click)="generatePDF()"
            class="px-4 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700 transition duration-200">
            สร้าง PDF
          </button>
          <button 
            type="button" 
            (click)="generateEXCEL()"
            class="px-4 py-2 text-sm bg-green-600 text-white rounded hover:bg-green-700 transition duration-200">
            สร้าง EXCEL
          </button>
        </div>
  
      </div>
    </div>
    <!-- Document Preview Area -->
    <div class="mt-3 border rounded bg-gray-50 overflow-hidden" style="height: 600px;">
      <div *ngIf="pdfSrc" class="w-full h-full">
        <iframe 
          [src]="pdfSrc" 
          title="รายงานสัดส่วนผู้ถือหุ้น"
          class="w-full h-full border-0"
          allowfullscreen>
        </iframe>
      </div>
    </div>
  
    <!-- Back Button -->
    <div class="flex justify-center mt-4">
      <button type="button" (click)="goBack()" class="px-5 py-2 text-sm bg-green-500 text-white rounded hover:bg-green-600">กลับ</button>
    </div>
  </div>
