<div class="p-3">
  <div class="max-w-2xl mx-auto rounded-lg p-6 bg-white shadow">
    
    <!-- Form Fields -->
    <div class="space-y-4">
      <!-- เลขที่บัตรแสดงตน -->
      <div class="flex gap-4 items-end">
        <div class="flex-1">
          <label for="idCardNumber" class="text-sm font-medium text-gray-700 mb-1 block">เลขที่บัตรแสดงตน</label>
          <input 
            type="text" 
            id="idCardNumber"
            [(ngModel)]="idCardNumber"
            placeholder="กรุณากรอกเลขที่บัตรแสดงตน"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <!-- ชื่อ และ นามสกุล -->
      <div class="flex gap-4 items-end">
        <div class="flex-1">
          <label for="firstName" class="text-sm font-medium text-gray-700 mb-1 block">ชื่อ</label>
          <input 
            type="text" 
            id="firstName"
            [(ngModel)]="firstName"
            placeholder="ชื่อ"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="flex-1">
          <label for="lastName" class="text-sm font-medium text-gray-700 mb-1 block">นามสกุล</label>
          <input 
            type="text" 
            id="lastName"
            [(ngModel)]="lastName"
            placeholder="นามสกุล"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <!-- ปี และ วันที่ -->
      <div class="flex gap-4 items-end">
        <div class="flex-1">
          <label for="selectedYear" class="text-sm font-medium text-gray-700 mb-1 block">ปี</label>
          <select 
            id="selectedYear"
            [(ngModel)]="selectedYear"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option *ngFor="let year of yearOptions" [value]="year.value">{{ year.label }}</option>
          </select>
        </div>
        <div class="flex-1">
          <label for="selectedDate" class="text-sm font-medium text-gray-700 mb-1 block">วันที่</label>
          <div class="relative">
            <input 
              id="selectedDate"
              type="text" 
              [value]="formatThaiDate(selectedDate)"
              (focus)="showDateCalendar = true"
              readonly
              class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-center focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
            <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
              <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
              </svg>
            </div>
            <div *ngIf="showDateCalendar" class="absolute z-50 top-full left-0 mt-1">
              <app-calendar-popup
                [(selected)]="selectedDate"
                (dateSelected)="onDateSelected($event)"
                (closed)="showDateCalendar = false">
              </app-calendar-popup>
            </div>
          </div>
        </div>
      </div>

      <!-- ผู้ลงนาม -->
      <div class="flex gap-4 items-end">
        <div class="flex-1">
          <label for="selectedSignatory" class="text-sm font-medium text-gray-700 mb-1 block">ผู้ลงนาม</label>
          <select 
            id="selectedSignatory"
            [(ngModel)]="selectedSignatory"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option *ngFor="let signatory of signatoryOptions" [value]="signatory.value">{{ signatory.label }}</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-center mt-8 space-x-4">
      <button type="button" (click)="onConfirm()"
        class="px-6 py-2 text-sm bg-gray-500 text-white rounded hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-50">
        ตกลง
      </button>
      <button type="button" (click)="onCancel()"
        class="px-6 py-2 text-sm bg-gray-500 text-white rounded hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-50">
        ยกเลิก
      </button>
    </div>
  </div>

  <!-- Document Preview Area -->
  <div class="mt-3 border rounded bg-gray-50 overflow-auto" style="height: 500px;">
    <iframe *ngIf="pdfSrc" [src]="pdfSrc" width="100%" height="100%" style="border:none;"
      title="Preview PDF รายงานหุ้น">
    </iframe>
  </div>

  <!-- Back Button -->
  <div class="flex justify-center mt-6">
    <button 
      type="button" 
      (click)="goBack()" 
      class="px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors duration-200">
      กลับ
    </button>
  </div>
  
</div>
