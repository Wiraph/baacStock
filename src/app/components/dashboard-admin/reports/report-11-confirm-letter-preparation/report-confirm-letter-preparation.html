<div class="p-3">
    <div class="max-w-3xl mx-auto rounded-lg p-4 bg-white shadow">
  
      <!-- Filters -->
      <div class="space-y-4">
        <!-- วันที่เริ่มต้น -->
        <div class="border-b border-gray-200 pb-4">
          <div class="flex gap-4 items-end">
            <div class="flex-1">
              <label for="fromDate" class="text-sm font-medium text-gray-700 mb-1 block">ตั้งแต่วันที่</label>
              <div class="relative">
                <input 
                  id="fromDate"
                  type="text" 
                  [value]="formatThaiDate(selectedDateFrom)"
                  (focus)="showCalendarFrom = true"
                  readonly
                  class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer text-center">
                <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                  <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                  </svg>
                </div>
                <div *ngIf="showCalendarFrom" class="absolute z-50 top-full left-0 mt-1">
                  <app-calendar-popup
                    [(selected)]="selectedDateFrom"
                    (dateSelected)="onDateFromSelected($event)"
                    (closed)="showCalendarFrom = false">
                  </app-calendar-popup>
                </div>
              </div>
            </div>
            
            <div class="flex-1">
              <label for="toDate" class="text-sm font-medium text-gray-700 mb-1 block">ถึงวันที่</label>
              <div class="relative">
                <input 
                  id="toDate"
                  type="text" 
                  [value]="formatThaiDate(selectedDateTo)"
                  (focus)="showCalendarTo = true"
                  readonly
                  class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer text-center">
                <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                  <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                  </svg>
                </div>
                <div *ngIf="showCalendarTo" class="absolute z-50 top-full left-0 mt-1">
                  <app-calendar-popup
                    [(selected)]="selectedDateTo"
                    (dateSelected)="onDateToSelected($event)"
                    (closed)="showCalendarTo = false">
                  </app-calendar-popup>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ปุ่มค้นหา -->
        <div class="flex justify-center pt-2">
          <button type="button"
                  (click)="onSearch()"
                  [disabled]=""
                  class="px-5 py-2 text-sm bg-green-600 text-white rounded hover:bg-green-700 disabled:opacity-60">
            <span *ngIf="">ค้นหารายงาน</span>
          </button>
        </div>

      </div>
    </div>
    
    <!-- Back Button -->
    <div class="flex justify-center mt-4">
      <button type="button" (click)="goBack()" class="px-5 py-2 text-sm bg-green-500 text-white rounded hover:bg-green-600">กลับ</button>
    </div>
  </div>
  
  <!-- ✅ Loading Overlay แบบโปร่งใส + มองทะลุ + เบลอ -->
  <div *ngIf="isLoading" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-100 bg-opacity-40 backdrop-blur-sm" style="background-color: rgba(128, 128, 128, 0.7);">
    <div class="text-center">
      <svg class="animate-spin h-10 w-10 text-blue-600 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none"
        viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
      </svg>
      <p class="text-lg text-white font-medium">🔄 กำลังโหลดข้อมูล กรุณารอสักครู่...</p>
    </div>
  </div>
