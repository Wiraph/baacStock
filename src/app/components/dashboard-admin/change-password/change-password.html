<div class="bg-gray-50 flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <h2 class="mt-6 text-center text-3xl font-bold text-gray-900">
      เปลี่ยนรหัสผ่าน
    </h2>
    <p class="mt-2 text-center text-sm text-gray-600">โปรดกรอกข้อมูลให้ครบถ้วน</p>
  </div>

  <div class="mt-12 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-6 shadow-lg rounded-lg">
      <div *ngIf="isFirstTimeUser || isPasswordExpired || isDefaultPassword" class="mb-8 p-4 bg-amber-50 border border-amber-200 rounded-lg">
        <div class="flex items-center justify-center">
          <div class="ml-3">
            <p class="text-xm font-medium align-middle flex-shrink-0 text-amber-800">
              ⚠️ รหัสผ่านหมดอายุ กรุณากำหนดรหัสผ่านใหม่ 
            </p>
          </div>
        </div>
      </div>
      <form class="space-y-5" (ngSubmit)="onChangePassword()">
        <!-- ชื่อผู้ใช้ -->
        <div>
          <label for="" class="block text-sm font-medium text-gray-700 mb-1">ชื่อผู้ใช้</label>
          <p class="text-gray-900 font-semibold bg-gray-100 px-3 py-2 rounded">{{ dataUser?.usrId || '' }}</p>
        </div>

        <!-- รหัสผ่านเดิม -->
        <div>
          <label for="oldPassword" class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่านเดิม</label>
          <input id="oldPassword" type="password" [(ngModel)]="oldPassword" name="oldPassword" required
            class="w-full px-3 py-2 border border-gray-300 rounded shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" />
        </div>

        <!-- รหัสผ่านใหม่ -->
        <div>
          <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่านใหม่</label>
          <input id="newPassword" type="password" [(ngModel)]="newPassword" name="newPassword" required
            class="w-full px-3 py-2 border border-gray-300 rounded shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" />
        </div>

        <!-- ยืนยันรหัสผ่านใหม่ -->
        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">ยืนยันรหัสผ่านใหม่</label>
          <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required
            class="w-full px-3 py-2 border border-gray-300 rounded shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" />
        </div>

        <!-- ชื่อ-นามสกุล -->
        <div>
          <label for class="block text-sm font-medium text-gray-700 mb-1">ชื่อ - นามสกุล</label>
          <p class="text-gray-900 font-semibold bg-gray-100 px-3 py-2 rounded">{{ dataUser?.usrDesc || '' }}</p>
        </div>

        <!-- ปุ่ม -->
        <div class="flex gap-2">
          <button type="submit"
            class="w-full flex justify-center items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none">
            ตกลง
          </button>
          <button (click)="onClear()" type="reset"
            class="w-full flex justify-center items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-gray-600 hover:bg-gray-700 focus:outline-none">
            Clear
          </button>
        </div>
      </form>
    </div>
  </div>
</div>


<!-- Loading Overlay -->
<div *ngIf="loading" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900 bg-opacity-50"
  style="background-color: rgba(128, 128, 128, 0.7);">
  <div class="text-center">
    <svg class="animate-spin h-10 w-10 text-blue-300 mx-auto mb-4" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="white" stroke-width="4" />
      <path class="opacity-75" fill="white" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
    </svg>
    <p class="text-white font-semibold">กำลังโหลดข้อมูล กรุณารอสักครู่...</p>
  </div>
</div>
