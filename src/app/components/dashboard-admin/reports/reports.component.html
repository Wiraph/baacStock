<div class="min-h-screen bg-gray-50 p-4 font-sans" *ngIf="main">
  <!-- Header Section -->
  <div class="max-w-6xl mx-auto">
    <!-- Page Header -->
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-gray-800 mb-2">📊 รายงานระบบ</h1>
      <p class="text-gray-600">เลือกดูรายงานที่ต้องการ</p>
    </div>

    <!-- Search and Filter Section -->
    <div class="mb-6 bg-white rounded-xl shadow-md p-6">
      <div class="flex flex-col md:flex-row gap-4">
        <!-- Search Box -->
        <div class="flex-1">
          <div class="relative">
            <input 
              type="text" 
              [(ngModel)]="searchTerm"
              (input)="onSearchChange()"
              placeholder="ค้นหารายงาน..." 
              class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
              </svg>
            </div>
            <button 
              *ngIf="searchTerm" 
              (click)="clearSearch()"
              class="absolute inset-y-0 right-0 pr-3 flex items-center">
              <svg class="h-5 w-5 text-gray-400 hover:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            </button>
          </div>
        </div>
        
        <!-- Category Filter -->
        <div class="md:w-48">
          <select 
            [(ngModel)]="selectedCategory"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <option *ngFor="let category of categories" [value]="category.value">
              {{ category.label }}
            </option>
          </select>
        </div>
      </div>
      
      <!-- Search Results Info -->
      <div *ngIf="searchTerm || selectedCategory !== 'all'" class="mt-4 text-sm text-gray-600">
        <span *ngIf="searchTerm">ผลการค้นหา "{{ searchTerm }}"</span>
        <span *ngIf="searchTerm && selectedCategory !== 'all'"> • </span>
        <span *ngIf="selectedCategory !== 'all'">หมวดหมู่: {{ getSelectedCategoryLabel() }}</span>
        <span class="ml-2 font-medium">พบ {{ filteredReports.length }} รายการ</span>
      </div>
    </div>

    <!-- Reports Container -->
    <div class="grid gap-6">
      
      <!-- Normal Reports Section -->
      <div class="bg-white rounded-xl shadow-md overflow-hidden">
        <div class="bg-gray-50 px-6 py-4 border-b border-gray-200">
          <div class="flex items-center">
            <span class="text-xl mr-3">📋</span>
            <h2 class="text-lg font-semibold text-gray-800">รายงานปกติ</h2>
            <span class="ml-auto bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-medium">
              {{ filteredReports.length }} รายการ
            </span>
          </div>
        </div>
        
        <div class="p-6">
          <!-- Reports List -->
          <div *ngIf="filteredReports.length > 0" class="grid gap-3">
            <div *ngFor="let report of filteredReports; let i = index" 
                 class="group relative">
              <button class="w-full flex items-center p-2 rounded-lg border border-gray-200 hover:border-gray-300 hover:bg-gray-50 cursor-pointer transition-all duration-200 ease-out hover:shadow-sm text-left"
                   (click)="onReportClick(report)">
                <div class="flex-shrink-0 w-10 h-10 bg-gray-100 rounded-lg flex items-center justify-center mr-4 group-hover:bg-gray-200 transition-colors duration-200">
                  <span class="text-gray-600 text-lg">{{ report.icon }}</span>
                </div>
                <div class="flex-1 min-w-0">
                  <h3 class="text-gray-800 font-medium text-sm leading-tight group-hover:text-gray-900 transition-colors duration-200">
                    {{ report.title }}
                  </h3>
                  <p class="text-gray-500 text-xs mt-1">คลิกเพื่อดูรายงาน</p>
                </div>
                <div class="flex-shrink-0 ml-4">
                  <svg class="w-4 h-4 text-gray-400 group-hover:text-gray-600 group-hover:translate-x-1 transition-all duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                  </svg>
                </div>
              </button>
            </div>
          </div>
          
          <!-- No Results Message -->
          <div *ngIf="filteredReports.length === 0" class="text-center py-12">
            <div class="text-gray-400 text-6xl mb-4">🔍</div>
            <h3 class="text-lg font-medium text-gray-900 mb-2">ไม่พบรายงานที่ค้นหา</h3>
            <p class="text-gray-500 mb-4">ลองใช้คำค้นหาอื่น หรือตรวจสอบการสะกด</p>
            <button 
              (click)="clearSearch(); selectedCategory = 'all'"
              class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200">
              ล้างการค้นหา
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
