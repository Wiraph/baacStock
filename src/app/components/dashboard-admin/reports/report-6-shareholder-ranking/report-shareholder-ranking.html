<div class="p-3">
    <div class="max-w-xl mx-auto rounded-lg p-4 bg-white shadow">
  
      <!-- Filters -->
      <div class="space-y-3">
        <!-- จำนวนอันดับ -->
        <div class="border-b border-gray-200 pb-4 mb-4">
          <div class="flex items-center justify-center gap-4">
            <label for="rankingCount" class="text-sm font-medium text-gray-700">จำนวนอันดับ :</label>
            <input 
              type="number" 
              id="rankingCount"
              [(ngModel)]="rankingCount"
              class="w-24 border border-gray-300 rounded-lg px-3 py-2 text-center text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" 
              min="1" 
              step="1">
          </div>
        </div>

        <!-- ประเภทลูกค้า -->
        <div class="border-b border-gray-200 pb-4 mb-4">
          <div class="flex items-center justify-center gap-4">
               <label for="customerType" class="text-sm font-medium text-gray-700">ประเภทลูกค้า:</label>
               <select 
                 id="customerType" 
                 [(ngModel)]="selectedCustype"
                 class="w-32 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                 <option value="">ทั้งหมด</option>
                 <option *ngFor="let custype of custypes" [value]="custype.cusCode">{{ custype.cusDesc }}</option>
               </select>
          </div>
        </div>
  
        <!-- Actions -->
        <div class="flex items-center justify-center space-x-4 pt-4">
          <button 
            type="button" 
            (click)="downloadReport()"
            class="px-3 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">DOWNLOAD</button>
        </div>
      </div>
    </div>
    
    <!-- Back Button -->
    <div class="flex justify-center mt-4">
      <button type="button" (click)="goBack()" class="px-5 py-2 text-sm bg-green-500 text-white rounded hover:bg-green-600">กลับ</button>
    </div>
  </div>
  
    <!-- ✅ Loading Overlay แบบโปร่งใส + มองทะลุ + เบลอ -->
    <div *ngIf="loading" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-100 bg-opacity-40 backdrop-blur-sm" style="background-color: rgba(128, 128, 128, 0.7);">
      <div class="text-center">
        <svg class="animate-spin h-10 w-10 text-blue-600 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
        </svg>
        <p class="text-lg text-white font-medium">🔄 กำลังโหลดข้อมูล กรุณารอสักครู่...</p>
      </div>
    </div>
