<div class="p-3">
    <div class="max-w-4xl mx-auto rounded-lg p-4 bg-white shadow">
  
      <!-- Filters -->
      <div class="space-y-4">
        <!-- ช่องค้นหาเลขที่ใบหุ้น -->
        <div class="border-b border-gray-200 pb-4">
          <div class="flex items-center gap-4">
            <div class="flex items-center">
              <input 
                type="radio" 
                id="searchByStockNumber" 
                name="searchType" 
                value="stockNumber"
                [(ngModel)]="selectedSearchType"
                (change)="onSearchTypeChange()"
                class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500">
              <label for="searchByStockNumber" class="ml-2 text-sm font-medium text-gray-700 cursor-pointer">เลขที่ใบหุ้น</label>
            </div>
            <div class="flex-1">
              <input 
                type="text" 
                id="stockNumber"
                [(ngModel)]="stockNumber"
                [disabled]="selectedSearchType !== 'stockNumber'"
                placeholder="กรอกเลขที่ใบหุ้น"
                class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed">
            </div>
          </div>
        </div>

        <!-- ช่องค้นหาวันที่ -->
        <div class="border-b border-gray-200 pb-4">
          <div class="flex items-center gap-4">
            <div class="flex items-center">
              <input 
                type="radio" 
                id="searchByDate" 
                name="searchType" 
                value="date"
                [(ngModel)]="selectedSearchType"
                (change)="onSearchTypeChange()"
                class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500">
              <label for="searchByDate" class="ml-2 text-sm font-medium text-gray-700 cursor-pointer">วันที่</label>
            </div>
            <div class="flex-1 flex gap-2">
              <select 
                [(ngModel)]="selectedDateType"
                [disabled]="selectedSearchType !== 'date'"
                class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed">
                <option value="">-- เลือกประเภทวันที่ --</option>
                <option value="issueDate">วันที่ออกเลขที่ใบหุ้น</option>
                <option value="saleDate">วันที่ขาย</option>
                <option value="approvalDate">วันที่สาขาอนุมัติ</option>
              </select>
              <select 
                [(ngModel)]="selectedDateMode"
                [disabled]="selectedSearchType !== 'date'"
                class="w-64 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed">
                <option value="">-- เลือกระยะเวลา --</option>
                <option value="year">ปี</option>
                <option value="dateRange">ช่วงวันที่</option>
                <option value="specificDate">วันที่</option>
              </select>
            </div>
          </div>
        </div>

     <!-- เลือกระยะเวลา -->
     <div class="flex justify-center" *ngIf="selectedSearchType === 'date' && selectedDateMode">
      <!-- แสดงเมื่อเลือก "ปี" -->
      <div *ngIf="selectedDateMode === 'year'" class="flex items-center gap-4">
        <div class="flex-1">
          <label for="yearSelect" class="text-sm font-medium text-gray-700 mb-1 block">ปี</label>
          <select 
            id="yearSelect"
            [(ngModel)]="selectedYear"
            class="w-24 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">ปี</option>
            <option *ngFor="let y of years" [value]="y">{{ y }}</option>
          </select>
        </div>
      </div>

      <!-- แสดงเมื่อเลือก "ช่วงวันที่" -->
      <div *ngIf="selectedDateMode === 'dateRange'" class="flex gap-4 items-end">
        <div class="flex-1">
          <label for="fromDate" class="text-sm font-medium text-gray-700 mb-1 block">ตั้งแต่วันที่</label>
          <div class="flex items-center gap-2">
            <select id="fromDate" class="w-20 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" [(ngModel)]="selectedFromDay">
              <option value="">วัน</option>
              <option *ngFor="let d of days" [value]="d">{{ d }}</option>
            </select>
            <select class="w-24 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" [(ngModel)]="selectedFromMonth">
              <option value="">เดือน</option>
              <option *ngFor="let m of months" [value]="m.value">{{ m.label }}</option>
            </select>
            <select class="w-24 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" [(ngModel)]="selectedFromYear">
              <option value="">ปี</option>
              <option *ngFor="let y of years" [value]="y">{{ y }}</option>
            </select>
          </div>
        </div>
        
        <div class="flex-1">
          <label for="toDate" class="text-sm font-medium text-gray-700 mb-1 block">ถึงวันที่</label>
          <div class="flex items-center gap-2">
            <select id="toDate" class="w-20 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" [(ngModel)]="selectedToDay">
              <option value="">วัน</option>
              <option *ngFor="let d of days" [value]="d">{{ d }}</option>
            </select>
            <select class="w-24 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" [(ngModel)]="selectedToMonth">
              <option value="">เดือน</option>
              <option *ngFor="let m of months" [value]="m.value">{{ m.label }}</option>
            </select>
            <select class="w-24 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" [(ngModel)]="selectedToYear">
              <option value="">ปี</option>
              <option *ngFor="let y of years" [value]="y">{{ y }}</option>
            </select>
          </div>
        </div>
      </div>

      <!-- แสดงเมื่อเลือก "วันที่" -->
      <div *ngIf="selectedDateMode === 'specificDate'" class="flex items-center gap-4">
        <div class="flex-1">
          <label for="specificDate" class="text-sm font-medium text-gray-700 mb-1 block">วันที่</label>
          <div class="flex items-center gap-2">
            <select id="specificDate" class="w-20 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" [(ngModel)]="selectedSpecificDay">
              <option value="">วัน</option>
              <option *ngFor="let d of days" [value]="d">{{ d }}</option>
            </select>
            <select class="w-24 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" [(ngModel)]="selectedSpecificMonth">
              <option value="">เดือน</option>
              <option *ngFor="let m of months" [value]="m.value">{{ m.label }}</option>
            </select>
            <select class="w-24 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-center" [(ngModel)]="selectedSpecificYear">
              <option value="">ปี</option>
              <option *ngFor="let y of years" [value]="y">{{ y }}</option>
            </select>
          </div>
        </div>
      </div>
     </div>

     <!-- Divider -->
     <div class="border-b border-gray-200 pb-4"></div>

         <!-- Actions -->
        <div class="flex items-center justify-center space-x-3">
          <button (click)="genPdf('PDF')" type="button" class="px-3 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">แสดงรายงาน PDF</button>
          <button (click)="genPdf('XLS')" type="button" class="px-3 py-2 text-sm bg-green-600 text-white rounded hover:bg-green-700">แสดงรายงาน EXCEL</button>
        </div>
      </div>
    </div>

    <!-- Document Preview Area -->
    <div class="mt-3 border rounded bg-gray-50 overflow-auto" style="height: 500px;">
      <iframe *ngIf="pdfSrc" [src]="pdfSrc" width="100%" height="100%" style="border:none;"
        title="Preview PDF รายงานหุ้น">
      </iframe>
    </div>

    <!-- Back Button -->
    <div class="flex justify-center mt-4 mb-8">
      <button type="button" (click)="goBack()"
        class="px-5 py-2 text-sm bg-green-500 text-white rounded hover:bg-green-600">กลับ</button>
    </div>
</div>
