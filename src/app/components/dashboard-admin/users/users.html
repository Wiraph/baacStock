<div class="p-6 bg-white shadow-md rounded-lg" *ngIf="activeView === 'users'">

    <h2 class="text-2xl font-semibold mb-4 flex justify-between items-center gap-2">
        <div>
            📋 รายชื่อผู้ใช้
            <span class="text-sm text-gray-500">({{ users.length }} รายการ)</span>
        </div>
        <div>
            <button (click)="adduser();" class="bg-blue-600 text-sm text-white px-4 py-2 rounded-md hover:bg-blue-700">
                เพิ่มผู้ใช้
            </button>
        </div>
    </h2>

    <!-- 🔍 ช่องค้นหา -->
    <div class="mb-4">
        <input type="text" [(ngModel)]="searchTerm" placeholder="ค้นหาด้วยรหัสผู้ใช้..."
            class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>

    <!-- ตารางผู้ใช้ -->
    <div *ngIf="filteredUsers.length > 0" class="overflow-x-auto">
        <table class="min-w-full border border-gray-300 text-sm text-left">
            <thead class="bg-gray-100 text-gray-700 uppercase tracking-wider">
                <tr>
                    <th class="px-4 py-2 border">ดำเนินการ</th>
                    <th class="px-4 py-2 border">รหัสผู้ใช้</th>
                    <th class="px-4 py-2 border">ชื่อ - นามสกุล</th>
                    <th class="px-4 py-2 border">ระดับการใช้งาน</th>
                    <th class="px-4 py-2 border">รหัสสาขา</th>
                    <th class="px-4 py-2 border">ชื่อสาขา</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let user of filteredUsers | paginate: { itemsPerPage: itemsPerPage, currentPage: page }"
                    class="hover:bg-gray-50 transition-colors">
                    <td class="px-4 py-2 border">
                        <div class="flex justify-center space-x-6">
                            <!-- Reset Password -->
                            <button 
                                (click)="manageUser(user, 'RESET_PASSWORD')" 
                                class="p-2 text-yellow-600 hover:bg-yellow-100 rounded-md transition-colors duration-200 cursor-pointer"
                                matTooltip="Reset รหัสผ่านเป็น baac"
                                [matTooltipShowDelay]="400">
                                🔑
                            </button>
                            
                            <!-- Reset User and Password -->
                            <button 
                                (click)="manageUser(user, 'RESET_USER')" 
                                class="p-2 text-orange-600 hover:bg-orange-100 rounded-md transition-colors duration-200 cursor-pointer"
                                matTooltip="Reset ผู้ใช้งานและรหัสผ่าน"
                                [matTooltipShowDelay]="400">
                                🔄
                            </button>
                            
                            <!-- Delete User -->
                            <button 
                                (click)="manageUser(user, 'DELETE_USER')" 
                                class="p-2 text-red-600 hover:bg-red-100 rounded-md transition-colors duration-200 cursor-pointer"
                                matTooltip="ลบผู้ใช้งานออกจากระบบ"
                                [matTooltipShowDelay]="400">
                                🗑️
                            </button>
                        </div>
                    </td>
                    <td class="px-4 py-2 border">{{ user.usrId }}</td>
                    <td class="px-4 py-2 border">{{ user.usrDesc }}</td>
                    <td class="px-4 py-2 border">{{ user.lvlDesc }}</td>
                    <td class="px-4 py-2 border">{{ user.usrBrc }}</td>
                    <td class="px-4 py-2 border">{{ user.brDesc }}</td>
                </tr>
            </tbody>
        </table>

        <pagination-controls *ngIf="users.length > itemsPerPage" (pageChange)="page = $event"
            class="mt-4 flex justify-end"></pagination-controls>
    </div>

    <p *ngIf="filteredUsers.length === 0" class="text-gray-500">ไม่พบผู้ใช้ที่ค้นหา</p>
</div>

<div *ngIf="activeView === 'adduser'">
    <app-adduser (back)="onBackFromAddUser()"></app-adduser>
</div>


<!-- ✅ Loading Overlay แบบโปร่งใส + มองทะลุ + เบลอ -->
<div *ngIf="loading"
    class="fixed inset-0 z-50 flex items-center justify-center bg-gray-100 bg-opacity-40 backdrop-blur-sm"
    style="background-color: rgba(128, 128, 128, 0.7);">
    <div class="text-center">
        <svg class="animate-spin h-10 w-10 text-blue-600 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none"
            viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
        </svg>
        <p class="text-lg text-white font-medium">🔄 กำลังโหลดข้อมูล กรุณารอสักครู่...</p>
    </div>
</div>
