<div class="p-3">
  <div class="max-w-2xl mx-auto rounded-lg p-6 bg-white shadow">
    
    <!-- Date Display Section -->
    <div class="mb-6">
      <div class="flex items-center justify-center">
        <div class="bg-gray-50 border border-gray-200 rounded-lg p-4 min-w-[300px] text-center">
          <label for="currentDate" class="block text-sm font-bold text-gray-700 mb-2">วันที่</label>
          <div class="text-lg font-semibold text-gray-900 bg-white border border-gray-300 rounded px-4 py-2">
            {{ currentDate }}
          </div>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-center space-x-3">
        <button type="button" (click)="loadFile('PDF')" class="px-3 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">PDF</button>
        <button type="button" (click)="loadFile('EXCEL')" class="px-3 py-2 text-sm bg-green-600 text-white rounded hover:bg-green-700">EXCEL</button>
    </div>
  </div>
  
  <!-- Document Preview Area -->
  <div class="mt-3 border rounded bg-gray-50 overflow-auto" style="height: 500px;">
    <iframe *ngIf="pdfSrc" [src]="pdfSrc" width="100%" height="100%" style="border:none;"
      title="Preview PDF รายงานหุ้น">
    </iframe>
  </div>

  <!-- Back Button -->
  <div class="flex justify-center mt-6">
    <button 
      type="button" 
      (click)="goBack()" 
      class="px-6 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors duration-200">
      กลับ
    </button>
  </div>
</div>
