<div class="p-3">
  <div class="max-w-3xl mx-auto rounded-lg p-4 bg-white shadow">

    <!-- Filters -->
    <div class="space-y-3">
      <!-- Row: ปีบัญชี -->
      <div class="border-b border-gray-200 pb-3 mb-3">
        <div class="grid grid-cols-12 gap-4 items-center">
          <!-- ระหว่างปีบัญชี -->
          <div class="col-span-2">
            <label for="yearFrom" class="text-sm text-gray-700">ระหว่างปีบัญชี</label>
          </div>
          <div class="col-span-4">
            <select 
              id="yearFrom"
              [(ngModel)]="selectedYearFrom"
              class="w-full border rounded px-2 py-1.5 text-center text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">เลือกปี</option>
              <option *ngFor="let y of years" [value]="y">{{ y }}</option>
            </select>
          </div>
          
          <!-- ถึงปีบัญชี -->
          <div class="col-span-2">
            <label for="yearTo" class="text-sm text-gray-700">ถึงปีบัญชี</label>
          </div>
          <div class="col-span-4">
            <select 
              id="yearTo"
              [(ngModel)]="selectedYearTo"
              class="w-full border rounded px-2 py-1.5 text-center text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="">เลือกปี</option>
              <option *ngFor="let y of years" [value]="y">{{ y }}</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-center space-x-3">
        <button 
          type="button" 
          (click)="generatePDF()"
          class="px-4 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700 transition duration-200">
          สร้าง PDF
        </button>
        <button 
          type="button" 
          (click)="generateEXCEL()"
          class="px-4 py-2 text-sm bg-green-600 text-white rounded hover:bg-green-700 transition duration-200">
          สร้าง EXCEL
        </button>
      </div>

    </div>
  </div>

  <!-- Document Preview Area -->
  <div class="mt-3 border rounded bg-gray-50 overflow-hidden" style="height: 600px;">
    <div *ngIf="pdfSrc" class="w-full h-full">
      <iframe 
        [src]="pdfSrc" 
        title="รายงานข้อมูลอัตราเงินปันผล"
        class="w-full h-full border-0"
        allowfullscreen>
      </iframe>
    </div>
  </div>

  <!-- Back Button -->
  <div class="flex justify-center mt-4">
    <button 
      type="button" 
      (click)="goBack()" 
      class="px-5 py-2 text-sm bg-green-500 text-white rounded hover:bg-green-600 transition duration-200">
      กลับ
    </button>
  </div>
</div>

  <!-- ✅ Loading Overlay แบบโปร่งใส + มองทะลุ + เบลอ -->
  <div *ngIf="loading" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-100 bg-opacity-40 backdrop-blur-sm" style="background-color: rgba(128, 128, 128, 0.7);">
    <div class="text-center">
      <svg class="animate-spin h-10 w-10 text-blue-600 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none"
        viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
      </svg>
      <p class="text-lg text-white font-medium">🔄 กำลังโหลดข้อมูล กรุณารอสักครู่...</p>
    </div>
  </div>
